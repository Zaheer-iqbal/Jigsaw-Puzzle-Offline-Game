name: jigsaw_pro
description: "A calm, offline jigsaw puzzle game for casual players."
publish_to: 'none'

version: 1.0.2+9

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & DI
  get: ^4.6.6
  get_it: ^8.0.3

  # Routing
  go_router: ^14.8.1

  # Local Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Audio & Haptics
  audioplayers: ^6.1.1

  # Monetization (Ads)
  google_mobile_ads: ^5.3.1

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/jigsaw.logo.png
    - assets/puzzles_manifest.json
    - assets/puzzles/nature/
    - assets/puzzles/animals/
    - assets/puzzles/flowers/
    - assets/puzzles/landmarks/
    - assets/puzzles/art/
    - assets/sounds/
